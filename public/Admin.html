<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        h1 {
            margin-top: 0;
        }

        #info {
            margin-bottom: 20px;
            color: #aaa;
        }

        #participants {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(350px, 1fr)
                );

            gap: 15px;
        }

        .participant {

            background: #222;

            padding: 12px;

            border-radius: 12px;

        }

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;

        }

        .name {

            font-size: 18px;

            font-weight: bold;

        }

        .status {
            font-size: 13px;
        }

        .online {
            color: #4cff72;
        }

        .offline {
            color: #ff5555;
        }

        .sharing {
            color: #4c9cff;
        }

        video {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: contain;

            background: black;

            border-radius: 8px;

        }

        .empty {

            text-align: center;

            padding: 80px;

            color: #666;

        }

    </style>

</head>

<body>

<h1>Event Admin Dashboard</h1>

<div id="info">

    Online participants:
    <strong id="count">0</strong>

</div>


<div id="participants">

    <div
        class="empty"
        id="empty"
    >
        No participants connected.
    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let iceServers = [
    { urls: "stun:stun.relay.metered.ca:80", }, { urls: "turn:global.relay.metered.ca:80", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", }, { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", }, { urls: "turn:global.relay.metered.ca:443", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", }, { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", },
];

const peers = {};
const pendingCandidates = {};

const ADMIN_PASSWORD = "SkibidiToilet";
socket.on("join-admin", (password) => {

    if (!ADMIN_PASSWORD || password !== ADMIN_PASSWORD) {

        socket.emit("admin-denied");

        return;
    }

    socket.data.role = "admin";

    console.log("Admin authenticated:", socket.id);

    const participants = [];

    for (const client of io.sockets.sockets.values()) {

        if (
            client.data.role === "participant" &&
            client.data.name
        ) {

            participants.push({
                socketId: client.id,
                name: client.data.name,
                screenReady:
                    client.data.screenReady === true
            });
        }
    }

    socket.emit("participant-list", participants);
});


// ========================================
// GET ICE CONFIG
// ========================================

async function loadIceConfig() {

    try {

        const response =
            await fetch("/ice-config");

        if (!response.ok) {
            throw new Error(
                "ICE config failed"
            );
        }


        const config =
            await response.json();


        if (
            config.iceServers &&
            config.iceServers.length > 0
        ) {

            iceServers =
                config.iceServers;

        }


        console.log(
            "ICE servers loaded:",
            iceServers
        );

    } catch (error) {

        console.error(
            "ICE config error:",
            error
        );

    }

}


loadIceConfig();


// ========================================
// CONNECT
// ========================================

socket.on("connect", () => {

    const password = prompt(
        "Enter admin password:"
    );

    if (!password) {
        document.body.innerHTML =
            "<h1>Access denied</h1>";
        return;
    }

    socket.emit(
        "join-admin",
        password
    );
});


socket.on("admin-denied", () => {

    document.body.innerHTML = `
        <div style="
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        ">
            <h1>Access Denied</h1>
            <p>Incorrect admin password.</p>
        </div>
    `;

    socket.disconnect();

});

// ========================================
// EXISTING PARTICIPANTS
// ========================================

socket.on(
    "participant-list",
    participants => {

        participants.forEach(
            participant => {

                addParticipant(
                    participant
                );


                if (
                    participant.screenReady
                ) {

                    createOffer(
                        participant.socketId
                    );

                }

            }
        );


        updateCount();

    }
);


// ========================================
// NEW PARTICIPANT
// ========================================

socket.on(
    "participant-joined",
    participant => {

        addParticipant(
            participant
        );


        updateCount();

    }
);


// ========================================
// SCREEN READY
// ========================================

socket.on(
    "screen-ready",
    participant => {

        console.log(
            "Screen ready:",
            participant.name
        );


        addParticipant(
            participant
        );


        setStatus(
            participant.socketId,
            "● CONNECTING",
            "sharing"
        );


        createOffer(
            participant.socketId
        );

    }
);


// ========================================
// SCREEN STOPPED
// ========================================

socket.on(
    "screen-stopped",
    participant => {

        const card =
            document.getElementById(
                "p-" +
                participant.socketId
            );


        if (!card) {
            return;
        }


        const video =
            card.querySelector(
                "video"
            );


        if (video) {

            video.srcObject =
                null;

        }


        setStatus(
            participant.socketId,
            "● SCREEN STOPPED",
            "offline"
        );


        if (
            peers[
                participant.socketId
            ]
        ) {

            peers[
                participant.socketId
            ].close();


            delete peers[
                participant.socketId
            ];

        }

    }
);


// ========================================
// PARTICIPANT LEFT
// ========================================

socket.on(
    "participant-left",
    participant => {

        console.log(
            "Participant left:",
            participant.name
        );


        const card =
            document.getElementById(
                "p-" +
                participant.socketId
            );


        if (!card) {
            return;
        }


        setStatus(
            participant.socketId,
            "● OFFLINE",
            "offline"
        );


        const video =
            card.querySelector(
                "video"
            );


        if (video) {

            video.srcObject =
                null;

        }


        if (
            peers[
                participant.socketId
            ]
        ) {

            peers[
                participant.socketId
            ].close();


            delete peers[
                participant.socketId
            ];

        }


        updateCount();

    }
);


// ========================================
// ADD PARTICIPANT
// ========================================

function addParticipant(
    participant
) {

    if (
        document.getElementById(
            "p-" +
            participant.socketId
        )
    ) {

        return;

    }


    const empty =
        document.getElementById(
            "empty"
        );


    if (empty) {
        empty.remove();
    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "participant";


    card.id =
        "p-" +
        participant.socketId;


    card.innerHTML = `

        <div class="header">

            <div class="name">
                ${escapeHTML(
                    participant.name
                )}
            </div>

            <div class="status online">
                ● ONLINE
            </div>

        </div>

        <video
            autoplay
            muted
            playsinline
        ></video>

    `;


    document
        .getElementById(
            "participants"
        )
        .appendChild(card);


    updateCount();

}


// ========================================
// CREATE OFFER
// ========================================

async function createOffer(
    target
) {

    if (
        peers[target]
    ) {

        peers[target].close();

    }


    const peer =
        new RTCPeerConnection({
            iceServers
        });


    peers[target] =
        peer;


    pendingCandidates[target] =
        [];


    // Tell participant:
    // Admin wants to receive video

    peer.addTransceiver(
        "video",
        {
            direction: "recvonly"
        }
    );


    // ====================================
    // RECEIVE SCREEN
    // ====================================

    peer.ontrack =
        event => {

            console.log(
                "Received screen:",
                target
            );


            const card =
                document.getElementById(
                    "p-" +
                    target
                );


            if (!card) {
                return;
            }


            const video =
                card.querySelector(
                    "video"
                );


            if (
                video &&
                event.streams.length > 0
            ) {

                video.srcObject =
                    event.streams[0];

            }


            setStatus(
                target,
                "● SHARING",
                "sharing"
            );

        };


    // ====================================
    // ICE
    // ====================================

    peer.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }


            socket.emit(
                "ice-candidate",
                {
                    target,
                    candidate:
                        event.candidate
                }
            );

        };


    // ====================================
    // STATES
    // ====================================

    peer.oniceconnectionstatechange =
        () => {

            console.log(
                "Admin ICE:",
                target,
                peer.iceConnectionState
            );

        };


    peer.onconnectionstatechange =
        () => {

            console.log(
                "Admin WebRTC:",
                target,
                peer.connectionState
            );


            if (
                peer.connectionState ===
                "connected"
            ) {

                setStatus(
                    target,
                    "● SHARING",
                    "sharing"
                );

            }


            if (
                peer.connectionState ===
                "failed"
            ) {

                setStatus(
                    target,
                    "● CONNECTION FAILED",
                    "offline"
                );

            }

        };


    // ====================================
    // CREATE OFFER
    // ====================================

    try {

        const offer =
            await peer.createOffer();


        await peer.setLocalDescription(
            offer
        );


        socket.emit(
            "offer",
            {
                target,
                offer
            }
        );


    } catch (error) {

        console.error(
            "Offer error:",
            error
        );

    }

}


// ========================================
// ANSWER
// ========================================

socket.on(
    "answer",
    async ({ sender, answer }) => {

        const peer =
            peers[sender];


        if (!peer) {
            return;
        }


        try {

            await peer.setRemoteDescription(
                answer
            );


            // Add candidates
            // that came early

            for (
                const candidate
                of pendingCandidates[sender] || []
            ) {

                await peer.addIceCandidate(
                    candidate
                );

            }


            pendingCandidates[sender] =
                [];


        } catch (error) {

            console.error(
                "Answer error:",
                error
            );

        }

    }
);


// ========================================
// ICE CANDIDATE
// ========================================

socket.on(
    "ice-candidate",
    async ({
        sender,
        candidate
    }) => {

        const peer =
            peers[sender];


        if (!peer) {

            if (
                !pendingCandidates[sender]
            ) {

                pendingCandidates[sender] =
                    [];

            }


            pendingCandidates[sender]
                .push(candidate);


            return;

        }


        try {

            if (
                peer.remoteDescription &&
                peer.remoteDescription.type
            ) {

                await peer.addIceCandidate(
                    candidate
                );

            } else {

                if (
                    !pendingCandidates[
                        sender
                    ]
                ) {

                    pendingCandidates[
                        sender
                    ] = [];

                }


                pendingCandidates[
                    sender
                ].push(candidate);

            }

        } catch (error) {

            console.error(
                "ICE candidate error:",
                error
            );

        }

    }
);


// ========================================
// STATUS
// ========================================

function setStatus(
    socketId,
    text,
    className
) {

    const card =
        document.getElementById(
            "p-" +
            socketId
        );


    if (!card) {
        return;
    }


    const status =
        card.querySelector(
            ".status"
        );


    if (!status) {
        return;
    }


    status.textContent =
        text;


    status.className =
        "status " +
        className;

}


// ========================================
// COUNT
// ========================================

function updateCount() {

    const cards =
        document.querySelectorAll(
            ".participant"
        );


    let online = 0;


    cards.forEach(
        card => {

            const status =
                card.querySelector(
                    ".status"
                );


            if (
                status &&
                !status.classList.contains(
                    "offline"
                )
            ) {

                online++;

            }

        }
    );


    document.getElementById(
        "count"
    ).textContent =
        online;

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}

</script>

</body>
</html>
