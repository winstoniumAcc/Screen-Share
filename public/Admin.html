<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        h1 {
            margin-top: 0;
        }

        #info {
            margin-bottom: 20px;
            color: #aaa;
        }

        #participants {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(350px, 1fr)
                );

            gap: 15px;
        }

        .participant {

            background: #222;

            padding: 12px;

            border-radius: 12px;
        }

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;
        }

        .name {

            font-size: 18px;

            font-weight: bold;
        }

        .status {
            font-size: 13px;
        }

        .online {
            color: #4cff72;
        }

        .offline {
            color: #ff5555;
        }

        .sharing {
            color: #4c9cff;
        }

        video {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: contain;

            background: black;

            border-radius: 8px;

        }

        .empty {

            text-align: center;

            padding: 80px;

            color: #666;

        }

    </style>

</head>


<body>

<h1>Event Admin Dashboard</h1>

<div id="info">

    Online participants:
    <strong id="count">0</strong>

</div>

<div id="participants">

    <div
        class="empty"
        id="empty"
    >
        No participants connected.
    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const peers = {};
const pendingCandidates = {};


// ==========================
// ADMIN CONNECTS
// ==========================

socket.on("connect", () => {

    console.log(
        "Admin connected:",
        socket.id
    );

    socket.emit("join-admin");

});


// ==========================
// EXISTING PARTICIPANTS
// ==========================

socket.on(
    "participant-list",
    participants => {

        participants.forEach(
            participant => {

                addParticipant(
                    participant
                );

                if (
                    participant.screenReady
                ) {

                    createOffer(
                        participant.socketId
                    );

                }

            }
        );

        updateCount();

    }
);


// ==========================
// NEW PARTICIPANT
// ==========================

socket.on(
    "participant-joined",
    participant => {

        addParticipant(
            participant
        );

        updateCount();

    }
);


// ==========================
// SCREEN READY
// ==========================

socket.on(
    "screen-ready",
    participant => {

        console.log(
            "Screen ready:",
            participant.name
        );

        addParticipant(
            participant
        );

        setStatus(
            participant.socketId,
            "● CONNECTING",
            "sharing"
        );

        createOffer(
            participant.socketId
        );

    }
);


// ==========================
// SCREEN STOPPED
// ==========================

socket.on(
    "screen-stopped",
    participant => {

        const element =
            document.getElementById(
                "p-" + participant.socketId
            );

        if (!element) {
            return;
        }

        const video =
            element.querySelector("video");

        if (video) {
            video.srcObject = null;
        }

        setStatus(
            participant.socketId,
            "● SCREEN STOPPED",
            "offline"
        );

        if (
            peers[
                participant.socketId
            ]
        ) {

            peers[
                participant.socketId
            ].close();

            delete peers[
                participant.socketId
            ];

        }

    }
);


// ==========================
// PARTICIPANT LEFT
// ==========================

socket.on(
    "participant-left",
    participant => {

        console.log(
            "Participant left:",
            participant.name
        );

        const element =
            document.getElementById(
                "p-" + participant.socketId
            );

        if (!element) {
            return;
        }

        setStatus(
            participant.socketId,
            "● OFFLINE",
            "offline"
        );

        const video =
            element.querySelector(
                "video"
            );

        if (video) {
            video.srcObject = null;
        }

        if (
            peers[
                participant.socketId
            ]
        ) {

            peers[
                participant.socketId
            ].close();

            delete peers[
                participant.socketId
            ];

        }

        updateCount();

    }
);


// ==========================
// ADD PARTICIPANT
// ==========================

function addParticipant(
    participant
) {

    if (
        document.getElementById(
            "p-" + participant.socketId
        )
    ) {
        return;
    }

    const empty =
        document.getElementById("empty");

    if (empty) {
        empty.remove();
    }

    const card =
        document.createElement("div");

    card.className =
        "participant";

    card.id =
        "p-" +
        participant.socketId;

    card.innerHTML = `

        <div class="header">

            <div class="name">
                ${escapeHTML(
                    participant.name
                )}
            </div>

            <div class="status online">
                ● ONLINE
            </div>

        </div>

        <video
            autoplay
            muted
            playsinline
        ></video>

    `;

    document
        .getElementById(
            "participants"
        )
        .appendChild(card);

    updateCount();

}


// ==========================
// CREATE OFFER
// ==========================

async function createOffer(
    target
) {

    // Close existing connection
    if (peers[target]) {

        peers[target].close();

        delete peers[target];

    }


    const peer =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    peers[target] =
        peer;

    pendingCandidates[target] =
        [];


    // ======================
    // RECEIVE VIDEO
    // ======================

    peer.addTransceiver(
        "video",
        {
            direction: "recvonly"
        }
    );


    peer.ontrack = event => {

        console.log(
            "Received video from:",
            target
        );


        const card =
            document.getElementById(
                "p-" + target
            );


        if (!card) {
            return;
        }


        const video =
            card.querySelector(
                "video"
            );


        video.srcObject =
            event.streams[0];


        // Explicitly start playback
        video.play().catch(
            error => {
                console.error(
                    "Video play error:",
                    error
                );
            }
        );


        setStatus(
            target,
            "● SHARING",
            "sharing"
        );

    };


    // ======================
    // ICE
    // ======================

    peer.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }

            socket.emit(
                "ice-candidate",
                {
                    target,
                    candidate:
                        event.candidate
                }
            );

        };


    peer.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                target,
                peer.iceConnectionState
            );

        };


    peer.onconnectionstatechange =
        () => {

            console.log(
                "Connection:",
                target,
                peer.connectionState
            );


            if (
                peer.connectionState ===
                "connected"
            ) {

                setStatus(
                    target,
                    "● SHARING",
                    "sharing"
                );

            }


            if (
                peer.connectionState ===
                "failed"
            ) {

                setStatus(
                    target,
                    "● CONNECTION FAILED",
                    "offline"
                );

            }

        };


    try {

        const offer =
            await peer.createOffer();


        await peer.setLocalDescription(
            offer
        );


        socket.emit(
            "offer",
            {
                target,
                offer
            }
        );


    } catch (error) {

        console.error(
            "Offer error:",
            error
        );

    }

}


// ==========================
// RECEIVE ANSWER
// ==========================

socket.on(
    "answer",
    async ({ sender, answer }) => {

        const peer =
            peers[sender];


        if (!peer) {
            return;
        }


        try {

            await peer.setRemoteDescription(
                answer
            );


            // Add candidates that arrived
            // before the answer

            if (
                pendingCandidates[sender]
            ) {

                for (
                    const candidate
                    of pendingCandidates[sender]
                ) {

                    await peer.addIceCandidate(
                        candidate
                    );

                }


                pendingCandidates[sender] =
                    [];

            }

        } catch (error) {

            console.error(
                "Answer error:",
                error
            );

        }

    }
);


// ==========================
// RECEIVE ICE
// ==========================

socket.on(
    "ice-candidate",
    async ({
        sender,
        candidate
    }) => {

        const peer =
            peers[sender];


        // Candidate came before
        // peer was created

        if (!peer) {

            if (
                !pendingCandidates[sender]
            ) {

                pendingCandidates[sender] =
                    [];

            }

            pendingCandidates[sender]
                .push(candidate);

            return;

        }


        try {

            if (
                peer.remoteDescription &&
                peer.remoteDescription.type
            ) {

                await peer.addIceCandidate(
                    candidate
                );

            } else {

                if (
                    !pendingCandidates[
                        sender
                    ]
                ) {

                    pendingCandidates[
                        sender
                    ] = [];

                }

                pendingCandidates[
                    sender
                ].push(candidate);

            }

        } catch (error) {

            console.error(
                "ICE error:",
                error
            );

        }

    }
);


// ==========================
// STATUS
// ==========================

function setStatus(
    socketId,
    text,
    className
) {

    const card =
        document.getElementById(
            "p-" + socketId
        );

    if (!card) {
        return;
    }

    const status =
        card.querySelector(
            ".status"
        );

    if (!status) {
        return;
    }

    status.textContent =
        text;

    status.className =
        "status " +
        className;

}


// ==========================
// COUNT
// ==========================

function updateCount() {

    const cards =
        document.querySelectorAll(
            ".participant"
        );

    let online = 0;

    cards.forEach(card => {

        const status =
            card.querySelector(
                ".status"
            );

        if (
            status &&
            !status.classList.contains(
                "offline"
            )
        ) {

            online++;

        }

    });

    document.getElementById(
        "count"
    ).textContent =
        online;

}


// ==========================
// ESCAPE HTML
// ==========================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}

</script>

</body>
</html>
