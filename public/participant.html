<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Event Participant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 500px;

            padding: 28px;

            background: #222;

            border-radius: 16px;

            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        p {
            color: #bbb;
            line-height: 1.5;
        }

        input {
            width: 100%;

            padding: 15px;

            margin-top: 18px;

            border: none;
            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        button {
            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: none;
            border-radius: 10px;

            background: #4c7dff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;

            padding: 15px;

            background: #333;

            border-radius: 10px;

            line-height: 1.4;
        }

        .green {
            color: #4cff72;
        }

        .red {
            color: #ff5555;
        }

        .yellow {
            color: #ffd24c;
        }

        .unsupported {
            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            background: #3a2f16;

            color: #ffd24c;

            display: none;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 22px;
                border-radius: 14px;
            }

            h1 {
                font-size: 24px;
            }

            button,
            input {
                font-size: 17px;
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Event Screen Sharing</h1>

    <p>
        Enter your name, then tap the button to share your screen.
    </p>

    <input
        id="name"
        type="text"
        placeholder="Your name"
        maxlength="50"
        autocomplete="name"
    >

    <button id="start">
        Start Screen Sharing
    </button>

    <div id="unsupported" class="unsupported">
        Screen sharing is not available in this browser.
        Please use a supported browser and make sure the site is opened with HTTPS.
    </div>

    <div id="status">
        Checking browser...
    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let screenStream = null;

let iceServers = [
    { urls: "stun:stun.relay.metered.ca:80", }, { urls: "turn:global.relay.metered.ca:80", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", }, { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", }, { urls: "turn:global.relay.metered.ca:443", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", }, { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "827a93ca2e7e93b4d15f094d", credential: "o8h4jqAFDO9qDUwO", },
];

const peers = {};
const pendingCandidates = {};

const nameInput =
    document.getElementById("name");

const startButton =
    document.getElementById("start");

const status =
    document.getElementById("status");

const unsupported =
    document.getElementById("unsupported");


// ========================================
// CHECK SCREEN SHARE SUPPORT
// ========================================

function supportsScreenSharing() {

    return (
        !!navigator.mediaDevices &&
        typeof navigator.mediaDevices.getDisplayMedia === "function"
    );

}


if (supportsScreenSharing()) {

    status.textContent =
        "Ready.";

} else {

    status.innerHTML =
        '<span class="yellow">Screen sharing is not supported in this browser.</span>';

    unsupported.style.display = "block";

    startButton.disabled = true;

}


// ========================================
// LOAD ICE CONFIG
// ========================================

async function loadIceConfig() {

    try {

        const response =
            await fetch("/ice-config", {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error("Failed to load ICE config");
        }

        const config =
            await response.json();

        if (
            config.iceServers &&
            config.iceServers.length > 0
        ) {

            iceServers =
                config.iceServers;

        }

        console.log(
            "ICE configuration loaded"
        );

    } catch (error) {

        console.error(
            "ICE configuration error:",
            error
        );

    }

}


loadIceConfig();


// ========================================
// SOCKET CONNECT
// ========================================

socket.on("connect", () => {

    console.log(
        "Connected:",
        socket.id
    );

    if (!screenStream) {

        status.textContent =
            "Connected. Ready to share.";

    }

});


// ========================================
// START SCREEN SHARING
// ========================================

startButton.addEventListener(
    "click",
    startSharing
);


async function startSharing() {

    if (!supportsScreenSharing()) {

        status.innerHTML =
            '<span class="red">Screen sharing is not supported on this browser.</span>';

        return;

    }


    const name =
        nameInput.value.trim();


    if (!name) {

        alert("Please enter your name.");

        nameInput.focus();

        return;

    }


    startButton.disabled = true;

    nameInput.disabled = true;


    status.textContent =
        "Opening screen sharing...";


    try {

        /*
         * The browser MUST ask the user
         * which screen/display to share.
         *
         * This call must happen from a user gesture.
         */

        screenStream =
            await navigator.mediaDevices.getDisplayMedia({

                video: {
                    frameRate: {
                        ideal: 15,
                        max: 30
                    }
                },

                audio: false

            });


        const videoTrack =
            screenStream.getVideoTracks()[0];


        // Tell the browser this is screen content.
        if ("contentHint" in videoTrack) {

            videoTrack.contentHint =
                "detail";

        }


        console.log(
            "Screen track:",
            videoTrack.getSettings()
        );


        // Join event
        socket.emit(
            "join-participant",
            name
        );


        // Tell admin screen is ready
        socket.emit(
            "screen-ready"
        );


        status.innerHTML =
            '<span class="green">● Screen sharing is active</span>';


        // Detect when user stops sharing
        videoTrack.addEventListener(
            "ended",
            handleScreenStopped
        );


    } catch (error) {

        console.error(
            "Screen sharing failed:",
            error
        );


        screenStream = null;


        nameInput.disabled = false;
        startButton.disabled = false;


        let message =
            "Screen sharing failed.";


        if (error.name === "NotAllowedError") {

            message =
                "Screen sharing was cancelled or permission was denied.";

        } else if (
            error.name === "NotSupportedError"
        ) {

            message =
                "This browser does not support screen sharing.";

        } else if (
            error.name === "AbortError"
        ) {

            message =
                "Screen sharing was cancelled.";

        } else if (
            error.name === "InvalidStateError"
        ) {

            message =
                "Please start screen sharing directly from the button.";

        }


        status.innerHTML =
            `<span class="red">${message}</span>`;

    }

}


// ========================================
// SCREEN STOPPED
// ========================================

function handleScreenStopped() {

    console.log(
        "Screen sharing stopped"
    );


    socket.emit(
        "screen-stopped"
    );


    for (
        const id in peers
    ) {

        try {
            peers[id].close();
        } catch {}

        delete peers[id];

    }


    status.innerHTML =
        '<span class="red">● Screen sharing stopped</span>';

}


// ========================================
// RECEIVE OFFER FROM ADMIN
// ========================================

socket.on(
    "offer",
    async ({ sender, offer }) => {

        if (!screenStream) {

            console.error(
                "Received WebRTC offer without screen stream"
            );

            return;

        }


        console.log(
            "Received offer from admin:",
            sender
        );


        if (peers[sender]) {

            try {
                peers[sender].close();
            } catch {}

        }


        const peer =
            new RTCPeerConnection({
                iceServers
            });


        peers[sender] =
            peer;


        pendingCandidates[sender] =
            [];


        // Add the screen track
        const tracks =
            screenStream.getTracks();


        for (
            const track of tracks
        ) {

            peer.addTrack(
                track,
                screenStream
            );

        }


        // ICE
        peer.onicecandidate =
            event => {

                if (!event.candidate) {
                    return;
                }


                socket.emit(
                    "ice-candidate",
                    {
                        target: sender,
                        candidate:
                            event.candidate
                    }
                );

            };


        peer.oniceconnectionstatechange =
            () => {

                console.log(
                    "Participant ICE:",
                    peer.iceConnectionState
                );

            };


        peer.onconnectionstatechange =
            () => {

                console.log(
                    "Participant connection:",
                    peer.connectionState
                );

            };


        try {

            await peer.setRemoteDescription(
                offer
            );


            // Add ICE candidates that arrived early
            for (
                const candidate
                of pendingCandidates[sender]
            ) {

                await peer.addIceCandidate(
                    candidate
                );

            }


            pendingCandidates[sender] =
                [];


            const answer =
                await peer.createAnswer();


            await peer.setLocalDescription(
                answer
            );


            socket.emit(
                "answer",
                {
                    target: sender,
                    answer
                }
            );


        } catch (error) {

            console.error(
                "WebRTC error:",
                error
            );

        }

    }
);


// ========================================
// RECEIVE ICE
// ========================================

socket.on(
    "ice-candidate",
    async ({
        sender,
        candidate
    }) => {

        if (!pendingCandidates[sender]) {

            pendingCandidates[sender] =
                [];

        }


        const peer =
            peers[sender];


        if (!peer) {

            pendingCandidates[sender]
                .push(candidate);

            return;

        }


        try {

            if (
                peer.remoteDescription &&
                peer.remoteDescription.type
            ) {

                await peer.addIceCandidate(
                    candidate
                );

            } else {

                pendingCandidates[sender]
                    .push(candidate);

            }

        } catch (error) {

            console.error(
                "ICE candidate error:",
                error
            );

        }

    }
);


// ========================================
// PAGE CLOSED
// ========================================

window.addEventListener(
    "beforeunload",
    () => {

        if (screenStream) {

            screenStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }

    }
);

</script>

</body>
</html>
