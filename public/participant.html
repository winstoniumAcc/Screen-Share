<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Participant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;

            padding: 40px;

            background: #222;

            border-radius: 15px;

            text-align: center;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #4c7dff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;

            padding: 15px;

            background: #333;

            border-radius: 8px;
        }

        .green {
            color: #4cff72;
        }

        .red {
            color: #ff5555;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Event Participant</h1>

    <p>
        Enter your name and start screen sharing.
    </p>

    <input
        id="name"
        type="text"
        placeholder="Your name"
        maxlength="50"
    >

    <button id="start">
        Start Screen Sharing
    </button>

    <div id="status">
        Connecting...
    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let screenStream = null;

let iceServers = [
    {
        urls: "stun:stun.l.google.com:19302"
    }
];

const peers = {};
const pendingCandidates = {};

const nameInput =
    document.getElementById("name");

const startButton =
    document.getElementById("start");

const status =
    document.getElementById("status");


// ========================================
// GET ICE CONFIG
// ========================================

async function loadIceConfig() {

    try {

        const response =
            await fetch("/ice-config");

        if (!response.ok) {
            throw new Error("ICE config failed");
        }

        const config =
            await response.json();

        if (
            config.iceServers &&
            config.iceServers.length > 0
        ) {

            iceServers =
                config.iceServers;

        }

        console.log(
            "ICE servers loaded:",
            iceServers
        );

    } catch (error) {

        console.error(
            "Could not load ICE config:",
            error
        );

    }

}


loadIceConfig();


// ========================================
// CONNECT
// ========================================

socket.on("connect", () => {

    status.textContent =
        "Connected.";

});


// ========================================
// START
// ========================================

startButton.addEventListener(
    "click",
    startSharing
);


async function startSharing() {

    const name =
        nameInput.value.trim();


    if (!name) {

        alert("Enter your name.");

        return;
    }


    startButton.disabled = true;
    nameInput.disabled = true;


    status.textContent =
        "Choose your screen...";


    try {

        screenStream =
            await navigator.mediaDevices
                .getDisplayMedia({
                    video: true,
                    audio: false
                });


        socket.emit(
            "join-participant",
            name
        );


        socket.emit(
            "screen-ready"
        );


        status.innerHTML =
            '<span class="green">● Screen sharing active</span>';


        const track =
            screenStream.getVideoTracks()[0];


        track.addEventListener(
            "ended",
            () => {

                status.innerHTML =
                    '<span class="red">● Screen sharing stopped</span>';


                socket.emit(
                    "screen-stopped"
                );

            }
        );


    } catch (error) {

        console.error(
            "Screen sharing error:",
            error
        );


        status.innerHTML =
            '<span class="red">Screen sharing was cancelled.</span>';


        startButton.disabled = false;
        nameInput.disabled = false;

    }

}


// ========================================
// RECEIVE OFFER
// ========================================

socket.on(
    "offer",
    async ({ sender, offer }) => {

        if (!screenStream) {

            console.error(
                "Received offer but no screen stream"
            );

            return;
        }


        if (peers[sender]) {

            peers[sender].close();

        }


        const peer =
            new RTCPeerConnection({
                iceServers
            });


        peers[sender] =
            peer;

        pendingCandidates[sender] =
            [];


        // Send screen video
        screenStream
            .getTracks()
            .forEach(track => {

                peer.addTrack(
                    track,
                    screenStream
                );

            });


        // ICE
        peer.onicecandidate =
            event => {

                if (!event.candidate) {
                    return;
                }


                socket.emit(
                    "ice-candidate",
                    {
                        target: sender,
                        candidate:
                            event.candidate
                    }
                );

            };


        peer.oniceconnectionstatechange =
            () => {

                console.log(
                    "Participant ICE:",
                    peer.iceConnectionState
                );

            };


        peer.onconnectionstatechange =
            () => {

                console.log(
                    "Participant connection:",
                    peer.connectionState
                );

            };


        try {

            await peer.setRemoteDescription(
                offer
            );


            // Add candidates received early

            for (
                const candidate
                of pendingCandidates[sender]
            ) {

                await peer.addIceCandidate(
                    candidate
                );

            }


            pendingCandidates[sender] =
                [];


            const answer =
                await peer.createAnswer();


            await peer.setLocalDescription(
                answer
            );


            socket.emit(
                "answer",
                {
                    target: sender,
                    answer
                }
            );


        } catch (error) {

            console.error(
                "WebRTC answer error:",
                error
            );

        }

    }
);


// ========================================
// ICE CANDIDATE
// ========================================

socket.on(
    "ice-candidate",
    async ({
        sender,
        candidate
    }) => {

        const peer =
            peers[sender];


        if (!peer) {

            if (
                !pendingCandidates[sender]
            ) {

                pendingCandidates[sender] =
                    [];

            }


            pendingCandidates[sender]
                .push(candidate);

            return;

        }


        try {

            if (
                peer.remoteDescription &&
                peer.remoteDescription.type
            ) {

                await peer.addIceCandidate(
                    candidate
                );

            } else {

                if (
                    !pendingCandidates[sender]
                ) {

                    pendingCandidates[sender] =
                        [];

                }


                pendingCandidates[sender]
                    .push(candidate);

            }

        } catch (error) {

            console.error(
                "ICE error:",
                error
            );

        }

    }
);


// ========================================
// CLOSE
// ========================================

window.addEventListener(
    "beforeunload",
    () => {

        if (screenStream) {

            screenStream
                .getTracks()
                .forEach(track => {
                    track.stop();
                });

        }

    }
);

</script>

</body>
</html>
